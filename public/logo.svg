<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
    <defs>
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#3B82F6" />
        </linearGradient>
    </defs>

    <!-- Scaled & Centered Audio Wave Icon -->
    <g transform="translate(8, 0)">
        <rect x="0" y="24" width="8" height="32" rx="4" fill="url(#waveGrad)" opacity="0.4"/>
        <rect x="14" y="12" width="8" height="56" rx="4" fill="url(#waveGrad)" opacity="0.7"/>
        <rect x="28" y="0" width="8" height="80" rx="4" fill="url(#waveGrad)"/>
        <rect x="42" y="16" width="8" height="48" rx="4" fill="url(#waveGrad)" opacity="0.7"/>
        <rect x="56" y="28" width="8" height="24" rx="4" fill="url(#waveGrad)" opacity="0.4"/>
    </g>
</svg>
